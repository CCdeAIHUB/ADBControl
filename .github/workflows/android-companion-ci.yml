name: Android Companion CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  android-companion:
    name: Android companion build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Build companion app and capture diagnostics
        id: android_build
        continue-on-error: true
        shell: bash
        working-directory: android/companion-app
        run: |
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-companion-diagnostics
          path: android/companion-app/android-build.log
          if-no-files-found: error

      - name: Fail on Android build diagnostics
        if: steps.android_build.outputs.status != '0'
        run: exit 1
